<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- =====================================================
         CONFIGURAÇÕES BÁSICAS
         ===================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Redefinir senha - Painel TV</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Reaproveita a base visual do login -->
    <link rel="stylesheet" href="/admin/login.css?v=reset-password-1" />

    <!-- Ajustes específicos desta tela -->
    <link rel="stylesheet" href="/admin/reset-password.css?v=reset-password-1" />
</head>

<body>
    <!-- =====================================================
         TELA DE REDEFINIÇÃO DE SENHA
         =====================================================

         Esta página é aberta a partir do link enviado por e-mail
         ou exibido no console em ambiente sem SMTP configurado.

         Fluxo:
         1. usuário acessa /admin/reset-password?token=...
         2. frontend lê o token da URL;
         3. usuário informa a nova senha;
         4. frontend envia token + senha para /api/auth/reset-password;
         5. backend valida token, troca senha e invalida sessões antigas.
         ===================================================== -->

    <main class="loginPage">
        <section class="loginCard resetPasswordCard" aria-labelledby="resetPasswordTitle">
            <div class="loginHeader">
                <img class="loginBrandLogo" src="/assets/logo_hor.svg" alt="Prefeitura de Ribas do Rio Pardo" />

                <span class="loginKicker">Segurança da conta</span>

                <h1 id="resetPasswordTitle">Redefinir senha</h1>

                <p>
                    Crie uma nova senha para acessar o Painel TV Prefeitura.
                </p>
            </div>

            <form id="resetPasswordForm" class="loginForm">
                <label for="newPassword">
                    Nova senha
                    <div class="passwordField">
                        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password"
                            placeholder="Digite a nova senha" />

                        <button id="btnToggleNewPassword" class="btnTogglePassword" type="button"
                            aria-label="Mostrar senha" title="Mostrar senha">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </label>

                <label for="confirmPassword">
                    Confirmar nova senha
                    <div class="passwordField">
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                            placeholder="Digite novamente a nova senha" />

                        <button id="btnToggleConfirmPassword" class="btnTogglePassword" type="button"
                            aria-label="Mostrar senha" title="Mostrar senha">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </label>

                <div class="passwordRules">
                    <span>
                        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                        Use pelo menos 6 caracteres.
                    </span>
                </div>

                <button id="btnResetPassword" type="submit">
                    Redefinir senha
                </button>

                <a class="resetBackLink" href="/admin/login">
                    Voltar ao login
                </a>
            </form>

            <div id="resetPasswordMessage" class="loginMessage hidden" role="alert" aria-live="assertive"></div>
        </section>
    </main>

    <footer class="loginFooter">
        © 2026 Prefeitura Municipal de Ribas do Rio Pardo - MS. Todos os direitos reservados.
    </footer>

    <script src="/admin/reset-password.js?v=reset-password-1"></script>
</body>

</html>
