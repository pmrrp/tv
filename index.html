<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- ======================================================
       CONFIGURAÇÕES BÁSICAS DA PÁGINA
       ====================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Painel TV Prefeitura</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Estilos principais -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!--
    =========================================================
    APP PRINCIPAL
    =========================================================
  -->
  <main id="app">

    <!--
      =======================================================
      AVISO DE ORIENTAÇÃO (MOBILE / TABLET)
      =======================================================

      Este bloco aparece em telas menores quando o dispositivo
      está em modo retrato, sugerindo girar para paisagem.
    -->
    <section id="rotateNotice" class="hidden">
      <div class="rotateNoticeContent">
        <i class="fa-solid fa-rotate-right"></i>
        <h2>Melhor visualização em modo horizontal</h2>
        <p>Gire o dispositivo para paisagem para visualizar o painel com mais conforto.</p>
        <button id="btnDismissRotate">Continuar assim mesmo</button>
      </div>
    </section>

    <!--
      =======================================================
      SPLASH SCREEN
      =======================================================
    -->
    <section id="splashScreen">
      <div id="splashOverlay"></div>
      <img id="splashWallpaper" alt="Wallpaper institucional" />
    </section>

    <!--
      =======================================================
      ÁREA PRINCIPAL DE MÍDIA
      =======================================================
    -->
    <section id="mediaArea">
      <video id="videoPlayer" autoplay muted playsinline preload="auto"></video>

      <video id="videoPreload" muted playsinline preload="auto" style="display: none;"></video>

      <img id="imagePlayer" alt="Conteúdo do painel" />
    </section>

    <!--
      =======================================================
      STATUS
      =======================================================
    -->
    <div id="status">Carregando conteúdo...</div>

    <!--
      =======================================================
      BARRA LATERAL / PAINEL DE CONTROLES
      =======================================================
    -->
    <aside id="sidePanel" class="controls-hidden">
      <div class="sidePanelTopBar"></div>

      <div class="sidePanelBody">
        <!-- Relógio -->
        <div class="sidePanelClock">
          <div id="sidebarClockTime">00:00:00</div>
          <div id="sidebarClockDate">00/00/0000</div>
        </div>

        <!-- Controles -->
        <div id="controls">
          <button id="btnPlayPause">
            <i class="fa-solid fa-play"></i>
            <span>Reproduzir</span>
          </button>

          <button id="btnNext">
            <i class="fa-solid fa-forward-step"></i>
            <span>Próximo</span>
          </button>

          <button id="btnPrev">
            <i class="fa-solid fa-backward-step"></i>
            <span>Anterior</span>
          </button>

          <button id="btnMute">
            <i class="fa-solid fa-volume-xmark"></i>
            <span>Som desligado</span>
          </button>

          <!--
            Botão extra útil para mobile/tablet.
            Em desktop/TV ele pode ficar discreto,
            mas em celular pode ajudar bastante.
          -->
          <button id="btnFullscreen">
            <i class="fa-solid fa-expand"></i>
            <span>Tela cheia</span>
          </button>
        </div>

        <!-- Texto de apoio -->
        <div class="sidePanelHint">
          <p>Mova o mouse ou use o controle para exibir os controles.</p>
          <p>Em dispositivos móveis, prefira o modo horizontal.</p>
        </div>

        <!-- Logo -->
        <div class="sidePanelLogoArea">
          <img id="sidePanelLogo" src="assets/logo-prefeitura.svg" alt="Identidade visual da Prefeitura" />
        </div>
      </div>

      <!-- Faixa inferior -->
      <div class="sidePanelBottomColors">
        <span class="colorStrip coral"></span>
        <span class="colorStrip yellow"></span>
        <span class="colorStrip green"></span>
        <span class="colorStrip blue"></span>
      </div>
    </aside>
  </main>

  <!-- Script principal -->
  <script src="script.js"></script>
</body>

</html>
