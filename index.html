<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- ======================================================
       CONFIGURAÇÕES BÁSICAS DA PÁGINA
       ====================================================== -->

  <!-- Define o conjunto de caracteres -->
  <meta charset="UTF-8" />

  <!-- Faz a página se adaptar ao tamanho da tela -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título exibido na aba do navegador -->
  <title>Painel TV Prefeitura</title>

  <!--
    FAVICON
    Se você já tiver um ícone/brasão pronto, pode usar aqui.
    Exemplos de nome:
    - assets/favicon.png
    - assets/favicon.svg
  -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Arquivo principal de estilos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!--
    =========================================================
    APP PRINCIPAL
    Container geral da aplicação
    Tudo o que pertence ao painel fica dentro deste bloco
    =========================================================
  -->
  <main id="app">

    <!--
      =======================================================
      SPLASH SCREEN
      =======================================================

      Tela inicial mostrada enquanto o sistema:
      - carrega config.json
      - carrega playlist.json
      - prepara a primeira mídia
      - entrega uma abertura mais institucional

      Observação:
      A splash acontece apenas na inicialização.
      Não usamos mais splash no meio do loop.
    -->
    <section id="splashScreen">
      <!-- Camada escura sobre o wallpaper -->
      <div id="splashOverlay"></div>

      <!-- Imagem institucional da splash -->
      <img id="splashWallpaper" alt="Wallpaper institucional" />
    </section>

    <!--
      =======================================================
      ÁREA PRINCIPAL DE MÍDIA
      =======================================================

      Elementos responsáveis pela exibição do conteúdo:

      videoPlayer:
      - reproduz o vídeo atual da playlist

      videoPreload:
      - pré-carrega o próximo vídeo
      - fica invisível
      - ajuda a reduzir travadas entre trocas

      imagePlayer:
      - exibe imagens da playlist
    -->
    <section id="mediaArea">
      <!-- Vídeo principal -->
      <video id="videoPlayer" autoplay muted playsinline preload="auto"></video>

      <!-- Vídeo invisível para pré-carregamento -->
      <video id="videoPreload" muted playsinline preload="auto" style="display: none;"></video>

      <!-- Exibição de imagens -->
      <img id="imagePlayer" alt="Conteúdo do painel" />
    </section>

    <!--
      =======================================================
      STATUS
      =======================================================

      Caixa usada para mensagens temporárias, por exemplo:
      - carregando vídeo
      - playlist atualizada
      - erro de mídia
      - preparando conteúdo

      Em produção, se quiser, pode ser desligada pelo config.json.
    -->
    <div id="status">Carregando conteúdo...</div>

    <!--
      =======================================================
      BARRA LATERAL
      =======================================================

      Painel lateral institucional exibido quando há interação:
      - mouse
      - clique
      - touch
      - controle remoto compatível

      Ela contém:
      - relógio/data
      - botões de controle
      - texto de apoio
      - identidade visual da prefeitura
    -->
    <aside id="sidePanel" class="controls-hidden">
      <!-- Faixa azul superior -->
      <div class="sidePanelTopBar"></div>

      <!-- Corpo da barra lateral -->
      <div class="sidePanelBody">

        <!--
          Relógio e data
          Ficam no topo da barra lateral
        -->
        <div class="sidePanelClock">
          <div id="sidebarClockTime">00:00:00</div>
          <div id="sidebarClockDate">00/00/0000</div>
        </div>

        <!--
          Controles principais do painel

          Botões:
          - play/pause
          - próximo
          - anterior
          - som
        -->
        <div id="controls">
          <button id="btnPlayPause">
            <i class="fa-solid fa-play"></i>
            <span>Reproduzir</span>
          </button>

          <button id="btnNext">
            <i class="fa-solid fa-forward-step"></i>
            <span>Próximo</span>
          </button>

          <button id="btnPrev">
            <i class="fa-solid fa-backward-step"></i>
            <span>Anterior</span>
          </button>

          <button id="btnMute">
            <i class="fa-solid fa-volume-xmark"></i>
            <span>Som desligado</span>
          </button>
        </div>

        <!--
          Texto de apoio
          Usado como orientação discreta ao usuário
        -->
        <div class="sidePanelHint">
          <p>Mova o mouse para exibir os controles.</p>
          <p>Ao parar, a barra lateral recolhe automaticamente.</p>
        </div>

        <!--
          Logo / identidade visual da prefeitura no rodapé da barra
          Ideal usar SVG ou PNG com fundo transparente.
        -->
        <div class="sidePanelLogoArea">
          <img id="sidePanelLogo" src="assets/logo-prefeitura.svg" alt="Identidade visual da Prefeitura" />
        </div>
      </div>

      <!--
        Faixa inferior com as 4 cores institucionais
      -->
      <div class="sidePanelBottomColors">
        <span class="colorStrip coral"></span>
        <span class="colorStrip yellow"></span>
        <span class="colorStrip green"></span>
        <span class="colorStrip blue"></span>
      </div>
    </aside>
  </main>

  <!-- ======================================================
       JAVASCRIPT PRINCIPAL DO SISTEMA
       ====================================================== -->
  <script src="script.js"></script>
</body>

</html>
