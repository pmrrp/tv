<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- ======================================================
       CONFIGURAÇÕES BÁSICAS DA PÁGINA
       ====================================================== -->

  <!-- Define o conjunto de caracteres da página -->
  <meta charset="UTF-8" />

  <!-- Faz a página se ajustar corretamente ao tamanho da tela -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título exibido na aba do navegador -->
  <title>Painel TV Prefeitura</title>

  <!-- Arquivo principal de estilos -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!--
    =========================================================
    APP PRINCIPAL
    Container geral de toda a aplicação
    Tudo do sistema fica dentro deste bloco
    =========================================================
  -->
  <main id="app">

    <!--
      =======================================================
      SPLASH SCREEN
      =======================================================

      Tela inicial exibida enquanto o sistema:
      - carrega o arquivo de configuração
      - carrega a playlist
      - prepara a primeira mídia
      - entrega uma abertura mais institucional e elegante

      Observação:
      Esta splash acontece apenas na entrada do sistema.
      Não usamos mais splash no reinício do loop da playlist.
    -->
    <section id="splashScreen">
      <!-- Camada escura sobre o wallpaper para dar mais contraste -->
      <div id="splashOverlay"></div>

      <!-- Imagem institucional de fundo da splash -->
      <img id="splashWallpaper" alt="Wallpaper institucional" />
    </section>

    <!--
      =======================================================
      ÁREA PRINCIPAL DE MÍDIA
      =======================================================

      Elementos responsáveis pela exibição do conteúdo.

      videoPlayer:
      - toca o vídeo atual da playlist

      videoPreload:
      - pré-carrega o próximo vídeo
      - fica invisível
      - ajuda a reduzir travamentos e atrasos entre mídias

      imagePlayer:
      - exibe imagens da playlist
    -->
    <section id="mediaArea">
      <!-- Player principal de vídeo -->
      <video id="videoPlayer" autoplay muted playsinline preload="auto"></video>

      <!-- Player invisível usado apenas para pré-carregamento -->
      <video id="videoPreload" muted playsinline preload="auto" style="display: none;"></video>

      <!-- Exibição de imagens -->
      <img id="imagePlayer" alt="Conteúdo do painel" />
    </section>

    <!--
      =======================================================
      STATUS
      =======================================================

      Caixa auxiliar usada principalmente para testes e manutenção.

      Exibe mensagens como:
      - carregando vídeo
      - playlist atualizada
      - erro ao carregar mídia

      Em modo produção, pode ser ocultada pelo config.json.
    -->
    <div id="status">Carregando conteúdo...</div>

    <!--
      =======================================================
      BARRA LATERAL DE CONTROLES
      =======================================================

      Painel lateral institucional.
      Ele aparece automaticamente ao mover o mouse/controle
      e recolhe após alguns segundos sem interação.
    -->
    <aside id="sidePanel" class="controls-hidden">
      <!-- Faixa azul superior -->
      <div class="sidePanelTopBar"></div>

      <!-- Corpo da barra -->
      <div class="sidePanelBody">

        <!-- Relógio/data -->
        <div class="sidePanelClock">
          <div id="sidebarClockTime">00:00:00</div>
          <div id="sidebarClockDate">00/00/0000</div>
        </div>

        <!-- Controles -->
        <div id="controls">
          <button id="btnPlayPause">▶ Play / Pause</button>
          <button id="btnNext">⏭ Próximo</button>
          <button id="btnPrev">⏮ Anterior</button>
          <button id="btnMute">🔇 / 🔊 Som</button>
        </div>

        <!-- Dicas -->
        <div class="sidePanelHint">
          <p>Mova o mouse para exibir os controles.</p>
          <p>Ao parar, a barra lateral recolhe automaticamente.</p>
        </div>

        <!-- Identidade visual da prefeitura no rodapé da barra -->
        <div class="sidePanelLogoArea">
          <img id="sidePanelLogo" src="assets/logo-prefeitura.svg" alt="Identidade visual da Prefeitura" />
        </div>
      </div>

      <!-- Faixa inferior com as 4 cores -->
      <div class="sidePanelBottomColors">
        <span class="colorStrip coral"></span>
        <span class="colorStrip yellow"></span>
        <span class="colorStrip green"></span>
        <span class="colorStrip blue"></span>
      </div>
    </aside>
  </main>

  <!-- ======================================================
       JAVASCRIPT PRINCIPAL DO SISTEMA
       ====================================================== -->
  <script src="script.js"></script>
</body>

</html>
